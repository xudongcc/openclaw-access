name: openclaw-access

services:
  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.4
    restart: always
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      OAUTH2_PROXY_CLIENT_ID: ${OAUTH2_PROXY_CLIENT_ID:?Set OAUTH2_PROXY_CLIENT_ID in .env}
      OAUTH2_PROXY_CLIENT_SECRET: ${OAUTH2_PROXY_CLIENT_SECRET:?Set OAUTH2_PROXY_CLIENT_SECRET in .env}
      OAUTH2_PROXY_COOKIE_SECRET: ${OAUTH2_PROXY_COOKIE_SECRET:?Set OAUTH2_PROXY_COOKIE_SECRET in .env}
    command:
      - --http-address=${OAUTH2_PROXY_HTTP_ADDRESS:-0.0.0.0:4180}
      - --provider=github
      - --email-domain=*
      - --github-org=${GITHUB_ORG:-Kudeploy}
      - --github-user=${GITHUB_USERS:-xudongcc}
      - --upstream=static://202
      - --reverse-proxy=true
      - --trusted-proxy-ip=${ACCESS_GATEWAY:-172.31.250.1}/32
      - --set-xauthrequest=true
      - --redirect-url=${OAUTH2_PROXY_REDIRECT_URL:-http://192.168.28.154:8080/oauth2/callback}
      - --whitelist-domain=${OAUTH2_PROXY_WHITELIST_DOMAIN:-192.168.28.154:8080}
      - --cookie-secure=${OAUTH2_PROXY_COOKIE_SECURE:-false}
      - --cookie-samesite=lax
      - --cookie-name=_openclaw_oauth2_proxy
      - --skip-provider-button=true
    networks:
      access:
        ipv4_address: ${OAUTH2_PROXY_IP:-172.31.250.2}

  caddy:
    image: caddy:2.11.4-alpine
    restart: always
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    environment:
      PUBLIC_URL: ${PUBLIC_URL:-http://192.168.28.154:8080}
      PUBLIC_SCHEME: ${PUBLIC_SCHEME:-http}
      OPENCLAW_ADMIN_EMAIL: ${OPENCLAW_ADMIN_EMAIL:-me@huangxudong.com}
      OPENCLAW_UPSTREAM: ${OPENCLAW_UPSTREAM:-host.docker.internal:18789}
    depends_on:
      - oauth2-proxy
    ports:
      - "${ACCESS_BIND_ADDRESS:-0.0.0.0}:${ACCESS_PORT:-8080}:8080"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      access:
        ipv4_address: ${CADDY_IP:-172.31.250.3}

networks:
  access:
    ipam:
      config:
        - subnet: ${ACCESS_SUBNET:-172.31.250.0/24}
          gateway: ${ACCESS_GATEWAY:-172.31.250.1}

volumes:
  caddy-data:
  caddy-config:
